<div class="login-container" data-aos="fade-up">
  <div class="login-background">
    <div class="background-pattern"></div>
  </div>
  
  <div class="login-content">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-logo">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to continue your learning journey</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group" data-aos="fade-right" data-aos-delay="100">
          <label class="form-label">
            <i class="fas fa-envelope"></i>
            Email Address
          </label>
          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="Enter your email address"
          />
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            Please enter a valid email address
          </div>
        </div>

        <div class="form-group" data-aos="fade-right" data-aos-delay="200">
          <label class="form-label">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter your password"
          />
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            Password must be at least 6 characters
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-banner" data-aos="shake">
          <i class="fas fa-exclamation-triangle"></i>
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-lg btn-block"
          [disabled]="loading"
          data-aos="fade-up" data-aos-delay="300"
        >
          <span *ngIf="!loading">
            <i class="fas fa-sign-in-alt"></i>
            Sign In
          </span>
          <span *ngIf="loading" class="loading-content">
            <div class="spinner-sm"></div>
            Signing in...
          </span>
        </button>
      </form>

      <div class="login-footer" data-aos="fade-up" data-aos-delay="400">
        <p class="footer-text">Don't have an account?</p>
        <button class="btn btn-outline" (click)="navigateToRegister()">
          <i class="fas fa-user-plus"></i>
          Sign Up
        </button>
      </div>
    </div>
  </div>
</div>
